<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagos Meet — Post Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script><script defer src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script><script defer src="app.js"></script></head>
<body>
<div class="position-x position-control"><input id="imageX" type="range" min="0" max="100" value="50" aria-label="Horizontal image position"></div><div class="position-y position-control"><input id="imageY" type="range" min="0" max="100" value="50" aria-label="Vertical image position"></div><main><div id="previewWrapper"><div id="postCard" class="portrait">
<div class="paper"><div class="card-header"><div class="brand"><span aria-hidden="true">☰</span><img crossorigin="anonymous" src="https://ik.imagekit.io/cokeroluwafemi/Group%20193.svg?updatedAt=1787000089733" alt="Lagos Meet"></div><button type="button" id="posterSearch" aria-label="Search articles" title="Search articles"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
<div class="card-text"><p id="previewDate" contenteditable="plaintext-only" aria-label="Publication date">Choose an article</p><h1 id="previewTitle" contenteditable="plaintext-only" aria-label="Article title">Stories worth sharing.</h1></div>
<div id="artworkContainer" title="Double-click to upload an image"><img id="previewImage" alt="Article cover"><span id="imageHint">Select a published story to load its cover</span></div></div>
</div></div></main>
<nav class="controls" aria-label="Generator controls"><img class="panel-logo" src="https://ik.imagekit.io/cokeroluwafemi/Group%20193.svg?updatedAt=1787000089733" alt="Lagos Meet"><button type="button" id="openArticles">Choose article</button><div class="formats"><button data-format="portrait" aria-pressed="true">4:5</button><button data-format="square" aria-pressed="false">1:1</button><button data-format="landscape" aria-pressed="false">1.91:1</button><button data-format="story" aria-pressed="false">9:16</button></div><button id="uploadBtn">Image</button><button id="autoColor">Match colour</button><button id="colourTrigger" class="colour-trigger" aria-label="Open background colour panel" aria-expanded="false" aria-controls="colourPanel"><span id="colourSwatch"></span></button><button type="button" id="modeToggle" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button><button id="download" disabled>Export PNG</button><button id="downloadVideo" title="6-second animation · date / Project of the Day" disabled>Export MP4</button></nav>
<section id="colourPanel" class="colour-panel" aria-label="Advanced background colour" hidden><div class="colour-heading"><div><small>BACKGROUND</small><h2>Find your colour</h2></div><button id="closeColour" aria-label="Close colour panel">✕</button></div><div id="colourPreview"></div><label for="hue">Hue <output id="hueValue"></output></label><input id="hue" type="range" min="0" max="360" value="201"><label for="saturation">Saturation <output id="satValue"></output></label><input id="saturation" type="range" min="0" max="100" value="56"><label for="lightness">Lightness <output id="lightValue"></output></label><input id="lightness" type="range" min="0" max="100" value="19"><div class="hex-row"><label for="hexColour">HEX</label><input id="hexColour" value="#163a4d" maxlength="7" spellcheck="false" aria-label="Hex colour"><input id="bgColor" type="color" value="#163a4d" aria-label="Open system colour picker"></div><div class="colour-presets" aria-label="Colour presets"><button data-colour="#163a4d" aria-label="Ocean"></button><button data-colour="#7c3aed" aria-label="Violet"></button><button data-colour="#ed6a45" aria-label="Coral"></button><button data-colour="#d0a660" aria-label="Sand"></button><button data-colour="#386641" aria-label="Forest"></button><button data-colour="#171717" aria-label="Ink"></button><button data-colour="#f3e9dc" aria-label="Cream"></button></div><button id="panelMatch">Match image palette</button></section><input type="file" id="imageUpload" accept="image/*" hidden><p id="toast" role="status" aria-live="polite" hidden></p>
<dialog id="articleDialog"><div class="dialog-head"><div><h2>Featured stories</h2><p>Published • date, title and cover set</p></div><button id="closeArticles" aria-label="Close article picker">✕</button></div><div class="search-row"><input id="search" type="search" placeholder="Search article titles…" aria-label="Search articles"><button id="refresh">Refresh</button></div><p id="loadStatus" role="status"></p><div id="articleList"></div></dialog>
</body></html>
