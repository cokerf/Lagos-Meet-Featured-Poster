<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagos Meet — Post Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script defer src="app.js"></script></head>
<body>
<header class="toolbar"><strong>Lagos Meet</strong><button id="openArticles">Choose article</button><span id="selected">No article selected</span></header>
<main><div id="previewWrapper"><div id="postCard" class="portrait">
<div class="paper"><div class="card-header"><div class="brand"><span aria-hidden="true">☰</span><img crossorigin="anonymous" src="https://ik.imagekit.io/cokeroluwafemi/Group%20193.svg?updatedAt=1787000089733" alt="Lagos Meet"></div><span aria-hidden="true">⌕</span></div>
<div class="card-text"><p id="previewDate" contenteditable="plaintext-only" aria-label="Publication date">Choose an article</p><h1 id="previewTitle" contenteditable="plaintext-only" aria-label="Article title">Stories worth sharing.</h1></div>
<div id="artworkContainer" title="Double-click to upload an image"><img id="previewImage" alt="Article cover"><span id="imageHint">Select a published story to load its cover</span></div></div>
</div></div></main>
<nav class="controls" aria-label="Generator controls"><div class="formats"><button data-format="portrait" aria-pressed="true">4:5</button><button data-format="square" aria-pressed="false">1:1</button><button data-format="landscape" aria-pressed="false">1.91:1</button><button data-format="story" aria-pressed="false">9:16</button></div><button id="uploadBtn">Image</button><button id="autoColor">Match colour</button><label title="Background colour"><input id="bgColor" type="color" value="#163a4d" aria-label="Background colour"></label><button id="download" disabled>Export PNG</button></nav>
<input type="file" id="imageUpload" accept="image/*" hidden><p id="toast" role="status" aria-live="polite" hidden></p>
<dialog id="articleDialog"><div class="dialog-head"><div><h2>Featured stories</h2><p>Published • date, title and cover set</p></div><button id="closeArticles" aria-label="Close article picker">✕</button></div><div class="search-row"><input id="search" type="search" placeholder="Search article titles…" aria-label="Search articles"><button id="refresh">Refresh</button></div><p id="loadStatus" role="status"></p><div id="articleList"></div></dialog>
</body></html>
